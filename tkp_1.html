        { q: "Salah seorang anggota tim sering datang terlambat dan mengganggu irama kerja bersama. Tindakan Anda...", opts: [{t: "Melaporkan keterlambatannya secara langsung pada bagian kedisiplinan.", s: 4}, {t: "Mengajaknya berbicara secara personal, menanyakan kendala keterlambatannya, dan menegaskan dampaknya bagi tim.", s: 5}, {t: "Acuh tak acuh karena urusan kedisiplinan adalah kewenangan atasan.", s: 1}, {t: "Menyindir perilakunya di depan forum anggota tim lainnya.", s: 2}, {t: "Membantu mengerjakan porsi tugas anggota yang terlambat tersebut.", s: 3}] },

        { q: "Menginternalisasikan nilai integritas ASN/Pelayan Publik dalam kehidupan harian...", opts: [{t: "Menjaga integritas hanya ketika sedang mengenakan seragam dinas resmi.", s: 2}, {t: "Menjadikan norma etika dan kebenaran hukum sebagai pedoman utama dalam berperilaku di dalam maupun luar tugas.", s: 5}, {t: "Menerapkan nilai integritas sejauh hal tersebut tidak merugikan karier.", s: 1}, {t: "Selalu berusaha konsisten antara ucapan dan tindakan serta menjadi teladan.", s: 4}, {t: "Mengikuti instruksi dan budaya integritas yang berlaku di unit kerja.", s: 3}] },

        { q: "Orientasi utama seorang pelayan publik dalam bertugas adalah...", opts: [{t: "Menjalankan seluruh instruksi pimpinan tanpa membantah demi menjaga hirarki komando.", s: 3}, {t: "Memberikan pengabdian terbaik demi keamanan, ketertiban, dan keadilan bagi masyarakat berbasis hukum.", s: 5}, {t: "Bekerja secara cermat untuk meraih jenjang karir dan kepangkatan yang tinggi.", s: 2}, {t: "Menjaga nama baik institusi dari segala bentuk ancaman dan citra negatif.", s: 4}, {t: "Mencari nafkah yang halal dan aman bagi kesejahteraan keluarga pribadi.", s: 1}] }
    ];

    let bankTKP = [];
    let currentQ = 0;
    let userAnswers = {};
    let timerInterval;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function encryptData(dataObj) {
        const str = JSON.stringify(dataObj);
        const bytes = new TextEncoder().encode(str);
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
        bankTKP = rawTKP.map(item => ({
            ...item,
            shuffledOpts: shuffleArray(item.opts)
        }));

        renderNav();
        loadQ(0);
        startTimer(35 * 60);
    });

    function loadQ(idx) {
        currentQ = idx;
        const qData = bankTKP[idx];
        document.getElementById('q-no').innerText = `Soal ${idx + 1} dari 45`;
        document.getElementById('q-text').innerText = qData.q;
        
        let html = '';
        const optsToRender = qData.shuffledOpts || qData.opts;
        optsToRender.forEach((opt, i) => {
            const isSelected = userAnswers[idx] === i ? 'selected' : '';
            html += `<div class="opt ${isSelected}" onclick="selectOpt(${i})">${String.fromCharCode(65+i)}. ${opt.t}</div>`;
        });
        document.getElementById('options').innerHTML = html;
        document.getElementById('btn-next').innerText = idx === bankTKP.length - 1 ? "Selesai" : "Selanjutnya";
        renderNav();
    }

    function selectOpt(optIdx) {
        userAnswers[currentQ] = optIdx;
        loadQ(currentQ);
        setTimeout(() => { nextQ(); }, 250);
    }

    function renderNav() {
        let html = '';
        for(let i = 0; i < bankTKP.length; i++) {
            let cls = 'nav-item';
            if(userAnswers[i] !== undefined) cls += ' filled';
            if(i === currentQ) cls += ' active';
            html += `<div class="${cls}" onclick="loadQ(${i})">${i + 1}</div>`;
        }
        document.getElementById('navGrid').innerHTML = html;
    }

    function nextQ() {
        if(currentQ === bankTKP.length - 1) {
            if(confirm("Apakah Anda yakin ingin menyelesaikan Tes TKP ini?")) finishTest();
            return;
        }
        loadQ(currentQ + 1);
    }

    function prevQ() {
        if(currentQ > 0) loadQ(currentQ - 1);
    }

    function startTimer(seconds) {
        let t = seconds;
        timerInterval = setInterval(() => {
            let m = Math.floor(t / 60);
            let s = t % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(--t < 0) {
                clearInterval(timerInterval);
                finishTest();
            }
        }, 1000);
    }

    function finishTest() {
        clearInterval(timerInterval);
        let totalSkor = 0;
        let dijawab = 0;
        let kosong = 0;
        let pembahasan = [];

        bankTKP.forEach((q, i) => {
            const uAns = userAnswers[i];
            const opts = q.shuffledOpts || q.opts;

            if(uAns !== undefined) {
                const selectedOpt = opts[uAns];
                totalSkor += selectedOpt.s;
                dijawab++;
                pembahasan.push({
                    soal: q.q,
                    jawabanUser: `${String.fromCharCode(65+uAns)}. ${selectedOpt.t} (Skor: ${selectedOpt.s})`,
                    kunci: 'Evaluasi Sikap Kerja',
                    isCorrect: selectedOpt.s === 5,
                    penjelasan: 'Opsi dengan nilai 5 mencerminkan integritas dan pelayanan profesional tertinggi.'
                });
            } else {
                kosong++;
                pembahasan.push({
                    soal: q.q,
                    jawabanUser: 'Tidak Dijawab',
                    kunci: 'Opsi Skor 5',
                    isCorrect: false,
                    penjelasan: 'Pilih opsi yang paling proaktif dan profesional.'
                });
            }
        });

        function decryptData(encryptedHex) {
            if (!encryptedHex) return null;
            try {
                const bytes = new Uint8Array(encryptedHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                return JSON.parse(new TextDecoder().decode(bytes));
            } catch (e) { return null; }
        }

        let resData = decryptData(localStorage.getItem('PRC_SKD_RESULT_ENC')) || JSON.parse(localStorage.getItem('PRC_SKD_RESULT') || '{}');
        resData.tkp_1 = { dijawab, kosong, score: totalSkor, max: 225, pembahasan };
        resData.timestamp = Date.now();

        const encrypted = encryptData(resData);
        localStorage.setItem('PRC_SKD_RESULT_ENC', encrypted);
        localStorage.setItem('PRC_SKD_RESULT', JSON.stringify(resData));

        alert(`Tes TKP Selesai!\nSkor Anda: ${totalSkor} / 225 (Dijawab: ${dijawab}, Tidak Dijawab: ${kosong})`);
        window.location.href = 'index.html';
    }
</script>
