        { q: "Prinsip saat terjadi sengketa informasi publik antara institusi dengan masyarakat...", opts: [{t: "Menutup rapat-rapat semua akses informasi institusi demi keamanan.", s: 1}, {t: "Mengedepankan keterbukaan informasi publik sesuai undang-undang dengan tetap menjaga rahasia negara.", s: 5}, {t: "Menyerahkan seluruh berkas informasi yang diminta masyarakat tanpa filter kerahasiaan.", s: 2}, {t: "Mendorong penyelesaian sengketa melalui jalur musyawarah kehumasan.", s: 4}, {t: "Menunggu putusan pengadilan sebelum memberikan informasi apapun.", s: 3}] },
        { q: "Menyelesaikan penugasan analisis yang butuh pencermatan tinggi saat ruangan bising...", opts: [{t: "Menegur rekan-rekan yang bising dengan nada tinggi.", s: 2}, {t: "Menunda pengerjaan tugas analisis sampai situasi ruangan kembali tenang.", s: 3}, {t: "Mencari ruangan kosong lain yang tenang di area kantor untuk melanjutkan kerja.", s: 4}, {t: "Menjaga fokus pikiran, mengkondisikan ruang kerja sementara atau menggunakan penyumbat telinga.", s: 5}, {t: "Mengeluhkan kondisi ruangan pada bagian rumah tangga kantor.", s: 1}] },
        { q: "Rekan dinas menggunakan kendaraan operasional kantor untuk liburan pribadi, tindakan Anda...", opts: [{t: "Melaporkan tindakan penyalahgunaan aset tersebut ke pengawas.", s: 4}, {t: "Mengingatkan secara baik-baik bahwa fasilitas kantor tidak boleh dipergunakan untuk kepentingan pribadi.", s: 5}, {t: "Diam saja karena merasa itu bukan urusan pribadi saya.", s: 1}, {t: "Ikut serta memanfaatkan fasilitas tersebut bila ada kesempatan.", s: 2}, {t: "Menyindir rekan tersebut di dalam grup pertemanan dinas.", s: 3}] },
        { q: "Bencana banjir menghadang jalur kegiatan operasional tim di lapangan. Sikap Anda...", opts: [{t: "Mengutamakan keselamatan jiwa anggota tim, mengubah rencana ke opsi darurat, dan berkoordinasi dengan tim SAR.", s: 5}, {t: "Meneruskan kegiatan utama meski risiko bahaya melingkupi anggota tim.", s: 1}, {t: "Membatalkan seluruh rangkaian kegiatan dan langsung memerintahkan anggota kembali.", s: 3}, {t: "Menunggu arahan instruksi komando pusat sebelum mengambil keputusan.", s: 4}, {t: "Memerintahkan anggota berteduh sampai banjir mereda tanpa batas waktu jelas.", s: 2}] },
        { q: "Menginternalisasikan nilai integritas ASN/Pelayan Publik dalam kehidupan harian...", opts: [{t: "Menjaga integritas hanya ketika sedang mengenakan seragam dinas resmi.", s: 2}, {t: "Menjadikan norma etika dan kebenaran hukum sebagai pedoman utama dalam berperilaku di dalam maupun luar tugas.", s: 5}, {t: "Menerapkan nilai integritas sejauh hal tersebut tidak merugikan karier.", s: 1}, {t: "Selalu berusaha konsisten antara ucapan dan tindakan serta menjadi teladan.", s: 4}, {t: "Mengikuti instruksi dan budaya integritas yang berlaku di unit kerja.", s: 3}] },
        { q: "Mendapat penghargaan atas keberhasilan proyek tim yang Anda pimpin, sikap Anda...", opts: [{t: "Menerima pujian tersebut sebagai bentuk pengakuan kapasitas kepemimpinan pribadi.", s: 2}, {t: "Menerima pujian dengan rendah hati dan menyampaikan bahwa keberhasilan ini merupakan kerja keras tim.", s: 5}, {t: "Membagikan sebagian bonus hadiah penghargaan kepada para anggota tim.", s: 4}, {t: "Menolak penghargaan tersebut karena merasa pengerjaan proyek belum sempurna.", s: 3}, {t: "Merayakan keberhasilan proyek pribadi bersama rekan pimpinan lain.", s: 1}] },
        { q: "Orientasi utama seorang pelayan publik dalam bertugas adalah...", opts: [{t: "Menjalankan seluruh instruksi pimpinan tanpa membantah demi menjaga hirarki komando.", s: 3}, {t: "Memberikan pengabdian terbaik demi keamanan, ketertiban, dan keadilan bagi masyarakat berbasis hukum.", s: 5}, {t: "Bekerja secara cermat untuk meraih jenjang karir dan kepangkatan yang tinggi.", s: 2}, {t: "Menjaga nama baik institusi dari segala bentuk ancaman dan citra negatif.", s: 4}, {t: "Mencari nafkah yang halal dan aman bagi kesejahteraan keluarga pribadi.", s: 1}] }
    ];

    let bankSKD = [];
    let currentQ = 0;
    let userAnswers = {};
    let timerInterval;

    // Security Helper: Auto-Shuffle
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Security Helper: Encrypt
    function encryptData(dataObj) {
        const str = JSON.stringify(dataObj);
        const bytes = new TextEncoder().encode(str);
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
        const prepareQuestions = (data, type) => {
            return data.map(item => {
                let newItem = { ...item, type };
                if (type === 'TKP') {
                    let optsWithOrig = item.opts.map((o, idx) => ({ ...o, origIdx: idx }));
                    newItem.shuffledOpts = shuffleArray(optsWithOrig);
                } else {
                    let optsWithOrig = item.opts.map((o, idx) => ({ text: o, isAns: idx === item.ans }));
                    let shuffled = shuffleArray(optsWithOrig);
                    newItem.shuffledOpts = shuffled.map(s => s.text);
                    newItem.newAns = shuffled.findIndex(s => s.isAns);
                }
                return newItem;
            });
        };

        const twkMapped = prepareQuestions(bankTWK_data, 'TWK');
        const tiuMapped = prepareQuestions(bankTIU_data, 'TIU');
        const tkpMapped = prepareQuestions(bankTKP_data, 'TKP');

        bankSKD = [...twkMapped, ...tiuMapped, ...tkpMapped];

        renderNav();
        loadQ(0);
        startTimer(100 * 60);
    });

    function loadQ(idx) {
        currentQ = idx;
        const qData = bankSKD[idx];
        
        document.getElementById('cat-badge').innerText = qData.type;
        document.getElementById('q-no').innerText = `Soal ${idx + 1} dari 110`;
        document.getElementById('q-text').innerText = qData.q;
        
        const figCont = document.getElementById('q-fig');
        if(qData.fig) {
            figCont.innerHTML = qData.fig;
            figCont.style.display = 'block';
        } else {
            figCont.style.display = 'none';
            figCont.innerHTML = '';
        }

        let html = '';
        const optsToRender = qData.shuffledOpts || qData.opts;
        optsToRender.forEach((opt, i) => {
            const isSelected = userAnswers[idx] === i ? 'selected' : '';
            const txt = typeof opt === 'object' ? opt.t : opt;
            html += `<div class="opt ${isSelected}" onclick="selectOpt(${i})">${String.fromCharCode(65+i)}. ${txt}</div>`;
        });
        document.getElementById('options').innerHTML = html;
        document.getElementById('btn-next').innerText = idx === bankSKD.length - 1 ? "Selesai" : "Selanjutnya";
        renderNav();
    }

    function selectOpt(optIdx) {
        userAnswers[currentQ] = optIdx;
        loadQ(currentQ);
        setTimeout(() => { nextQ(); }, 250);
    }

    function renderNav() {
        let html = '';
        for(let i = 0; i < bankSKD.length; i++) {
            let cls = 'nav-item';
            if(userAnswers[i] !== undefined) cls += ' filled';
            if(i === currentQ) cls += ' active';
            html += `<div class="${cls}" onclick="loadQ(${i})">${i + 1}</div>`;
        }
        document.getElementById('navGrid').innerHTML = html;
    }

    function nextQ() {
        if(currentQ === bankSKD.length - 1) {
            if(confirm("Apakah Anda yakin ingin menyelesaikan Simulasi SKD Lengkap ini?")) finishTest();
            return;
        }
        loadQ(currentQ + 1);
    }

    function prevQ() {
        if(currentQ > 0) loadQ(currentQ - 1);
    }

    function startTimer(seconds) {
        let t = seconds;
        timerInterval = setInterval(() => {
            let m = Math.floor(t / 60);
            let s = t % 60;
            document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(--t < 0) {
                clearInterval(timerInterval);
                finishTest();
            }
        }, 1000);
    }

    function finishTest() {
        clearInterval(timerInterval);
        
        let twkB = 0, twkS = 0, twkK = 0;
        let twkPembahasan = [];
        for(let i=0; i<30; i++) {
            const q = bankSKD[i];
            const uAns = userAnswers[i];
            const correctIdx = q.newAns !== undefined ? q.newAns : q.ans;
            const isCorrect = uAns === correctIdx;
            
            if(uAns === undefined) twkK++;
            else if(isCorrect) twkB++;
            else twkS++;

            const opts = q.shuffledOpts || q.opts;
            twkPembahasan.push({
                soal: q.q,
                jawabanUser: uAns !== undefined ? `${String.fromCharCode(65+uAns)}. ${opts[uAns]}` : 'Tidak Dijawab',
                kunci: `${String.fromCharCode(65+correctIdx)}. ${opts[correctIdx]}`,
                isCorrect: isCorrect,
                penjelasan: 'Soal TWK menguji wawasan kebangsaan dan nilai Pancasila.'
            });
        }

        let tiuB = 0, tiuS = 0, tiuK = 0;
        let tiuPembahasan = [];
        for(let i=30; i<65; i++) {
            const q = bankSKD[i];
            const uAns = userAnswers[i];
            const correctIdx = q.newAns !== undefined ? q.newAns : q.ans;
            const isCorrect = uAns === correctIdx;

            if(uAns === undefined) tiuK++;
            else if(isCorrect) tiuB++;
            else tiuS++;

            const opts = q.shuffledOpts || q.opts;
            tiuPembahasan.push({
                soal: q.q,
                jawabanUser: uAns !== undefined ? `${String.fromCharCode(65+uAns)}. ${opts[uAns]}` : 'Tidak Dijawab',
                kunci: `${String.fromCharCode(65+correctIdx)}. ${opts[correctIdx]}`,
                isCorrect: isCorrect,
                penjelasan: 'Soal TIU menguji penalaran verbal, numerik, dan figural.'
            });
        }

        let tkpSkor = 0, tkpD = 0, tkpK = 0;
        let tkpPembahasan = [];
        for(let i=65; i<110; i++) {
            const q = bankSKD[i];
            const uAns = userAnswers[i];
            const opts = q.shuffledOpts || q.opts;

            if(uAns === undefined) {
                tkpK++;
                tkpPembahasan.push({
                    soal: q.q,
                    jawabanUser: 'Tidak Dijawab',
                    kunci: 'Opsi Skor 5',
                    isCorrect: false,
                    penjelasan: 'Pilih opsi yang mencerminkan profesionalisme tinggi.'
                });
            } else {
                tkpD++;
                const selectedOpt = opts[uAns];
                tkpSkor += selectedOpt.s;
                tkpPembahasan.push({
                    soal: q.q,
                    jawabanUser: `${String.fromCharCode(65+uAns)}. ${selectedOpt.t} (Skor: ${selectedOpt.s})`,
                    kunci: 'Evaluasi berdasarkan indikator sikap kerja.',
                    isCorrect: selectedOpt.s === 5,
                    penjelasan: 'Opsi dengan skor tertinggi menunjukkan karakter kepemimpinan dan pelayanan terbaik.'
                });
            }
        }

        let resData = {
            twk: { benar: twkB, salah: twkS, kosong: twkK, score: twkB * 5, max: 150, pembahasan: twkPembahasan },
            tiu: { benar: tiuB, salah: tiuS, kosong: tiuK, score: tiuB * 5, max: 175, pembahasan: tiuPembahasan },
            tkp: { dijawab: tkpD, kosong: tkpK, score: tkpSkor, max: 225, pembahasan: tkpPembahasan },
            timestamp: Date.now()
        };

        const encrypted = encryptData(resData);
        localStorage.setItem('PRC_SKD_RESULT_ENC', encrypted);
        localStorage.setItem('PRC_SKD_RESULT', JSON.stringify(resData));

        alert("Simulasi SKD Lengkap Selesai!\nHasil akhir Anda telah tersimpan secara aman.");
        window.location.href = 'rekap_nilai.html';
    }
</script>
